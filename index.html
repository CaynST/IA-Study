<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de estudio para el curso de Inteligencia Artificial: lecciones, práctica, simulacros y seguimiento de progreso. Sitio estático."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Estudio de IA · Lecciones y simulacros</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo.
      (function () {
        try {
          var stored = localStorage.getItem('ia-study:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
